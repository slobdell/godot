[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="doctrines/*.json"
exclude_filter="tests/*, build/*, assets/pipeline/*, game/theme/kitbash/*, game/theme/neon_kit/*"
export_path="build/web/index.html"

[preset.0.options]

; Single-threaded build: no SharedArrayBuffer, so ANY static host works without
; COOP/COEP headers. See _agents/bootstrap.md.
variant/thread_support=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]

name="Linux Server"
platform="Linux"
runnable=false
dedicated_server=true
custom_features="server"
export_filter="all_resources"
include_filter="doctrines/*.json"
exclude_filter="tests/*, build/*, assets/pipeline/*, game/theme/kitbash/*, game/theme/neon_kit/*"
export_path="build/server/tank_squad_server.x86_64"

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
